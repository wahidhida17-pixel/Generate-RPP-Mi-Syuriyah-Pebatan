    <title>Remix APLIKASI GURU AI</title>

    <meta property="og:title" content="Remix APLIKASI GURU AI" />
    <meta property="og:description" content="Sistem Administrasi Guru Digital terintegrasi Asisten AI dan Firebase Database." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("edadmin_theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
