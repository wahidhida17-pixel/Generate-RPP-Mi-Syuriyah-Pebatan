<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-title" content="GuruAI" />
    <link rel="icon" id="dynamic-favicon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Remix APLIKASI GURU AI</title>
    <meta name="description" content="Sistem Administrasi Guru Digital terintegrasi Asisten AI dan Firebase Database." />
    <meta property="og:title" content="Remix APLIKASI GURU AI" />
    <meta property="og:description" content="Sistem Administrasi Guru Digital terintegrasi Asisten AI dan Firebase Database." />
    <script>
      (function() {
        try {
          var savedFavicon = localStorage.getItem("edadmin_favicon");
          if (savedFavicon) {
            var fav = document.getElementById("dynamic-favicon");
            if (fav) fav.setAttribute("href", savedFavicon);
          }
          var saved = localStorage.getItem("edadmin_theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
