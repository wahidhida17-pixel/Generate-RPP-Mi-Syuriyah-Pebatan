<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />

  <!-- Inner Decorative Glow -->
  <circle cx="256" cy="240" r="160" fill="#fbbf24" opacity="0.08" />

  <!-- Graduation Cap -->
  <g transform="translate(0, 10)">
    <!-- Mortarboard Top / Rhombus -->
    <path d="M 256,120 L 420,195 L 256,270 L 92,195 Z" fill="url(#capGrad)" stroke="#fef3c7" stroke-width="6" stroke-linejoin="round" />

    <!-- Cap Base / Skullcap -->
    <path d="M 160,230 L 160,300 C 160,350 352,350 352,300 L 352,230 L 256,270 Z" fill="#b45309" stroke="#fef3c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Cap Ribbon / Tassel -->
    <path d="M 256,195 L 390,240 L 390,320" fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="390" cy="330" r="14" fill="#fde047" />
    <path d="M 384,342 L 396,342 L 392,370 L 388,370 Z" fill="#fde047" />
  </g>

  <!-- AI Sparkle 1 -->
  <path d="M 120,130 Q 120,150 100,150 Q 120,150 120,170 Q 120,150 140,150 Q 120,150 120,130 Z" fill="#38bdf8" />
  <!-- AI Sparkle 2 -->
  <path d="M 400,130 Q 400,145 385,145 Q 400,145 400,160 Q 400,145 415,145 Q 400,145 400,130 Z" fill="#38bdf8" />

  <!-- Subtitle Badge: GURU AI -->
  <rect x="146" y="395" width="220" height="52" rx="26" fill="url(#goldGrad)" />
  <text x="256" y="430" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0f172a" text-anchor="middle" letter-spacing="2">GURU AI</text>
</svg>
